<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Music</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0d17;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="app-frame" src=""></iframe>

  <script>
    // 📍 ใส่ URL เว็บแอป Apps Script ของคุณตรงนี้
    const gasUrl = "https://script.google.com/macros/s/AKfycby8FQu8lZZ4RiSBiZHtj1FIbX1AoAcv98IUlcMO6mhMjUfFBc9C7Zp8ZzdPqSD0pht0tQ/exec";
    
    // ดึงค่า ?page=admin (ถ้ามี) จาก URL ของ GitHub
    const searchParams = window.location.search;
    
    // กำหนด URL ให้ iframe อัตโนมัติ
    document.getElementById('app-frame').src = gasUrl + searchParams;
  </script>
</body>
</html>
