<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Music</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0d17;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="app-frame" src=""></iframe>

  <script>
    // URL ของ Google Apps Script เว็บแอปของคุณ
    const gasUrl = "https://script.google.com/macros/s/AKfycbzZGtp-vUOOhseZgFmlUrnuDquVGuq3RzF01zx89XsPlOjUUPciK6EYB8jkkzZd7sf1hg/exec";
    
    // ส่งค่า ?page=admin หรือ Parameter อื่นๆ ต่อไปยัง iframe อัตโนมัติ
    document.getElementById('app-frame').src = gasUrl + window.location.search;
  </script>
</body>
</html>
